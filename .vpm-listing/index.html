<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ThreadLight Authoring</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #121110; color: #fbf2e3; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 18% 18%, rgba(255, 128, 33, .14), transparent 34rem), #121110; }
    main { width: min(680px, 100%); padding: 48px; border: 1px solid rgba(255, 168, 61, .28); border-radius: 14px; background: linear-gradient(145deg, #2e2a26, #181715); box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
    small { color: #ffa83d; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.02; }
    p { color: #d5c7b5; font-size: 1.05rem; line-height: 1.65; }
    a { color: #ffd27a; }
  </style>
</head>
<body>
  <main>
    <small>ThreadLight</small>
    <h1>Authoring</h1>
    <p>Shared creator-side infrastructure installed automatically by ThreadLight Builder products.</p>
    <a href="https://github.com/Wolfy527/threadlight-authoring">View documentation</a>
  </main>
</body>
</html>
